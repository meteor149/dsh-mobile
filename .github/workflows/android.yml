name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK to the versioned GitHub prerelease
        required: true
        type: boolean
        default: false

env:
  APP_VERSION: 0.0.1-BETA

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore runtime artifacts
        id: runtime-cache
        uses: actions/cache@v6
        with:
          path: runtime/dist
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/versions.env', 'runtime/rootfs/**', 'runtime/proot/**', 'tools/generate-runtime-manifest.mjs') }}

      - name: Build runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: ./gradlew buildRuntime

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          publish=false
          tag="v$APP_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$APP_VERSION" ]]; then
              echo "Tag $tag does not match app version v$APP_VERSION" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ inputs.publish_release }}" == true ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            if [[ "${{ steps.release.outputs.publish }}" == true ]]; then
              echo "Release publishing requires all ANDROID_RELEASE_* secrets" >&2
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/dsh-mobile-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test and package
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease

      - name: Stage release APK
        id: package
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.signed }}" == true ]]; then
            source_apk=app/build/outputs/apk/release/app-release.apk
            artifact_name="dsh-mobile-$APP_VERSION-arm64-v8a"
          else
            source_apk=app/build/outputs/apk/release/app-release-unsigned.apk
            artifact_name="dsh-mobile-$APP_VERSION-arm64-v8a-unsigned"
          fi
          test -f "$source_apk"
          apk_name="$artifact_name.apk"
          cp "$source_apk" "$apk_name"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DSH Mobile ${{ env.APP_VERSION }}
          files: ${{ steps.package.outputs.apk_name }}
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
